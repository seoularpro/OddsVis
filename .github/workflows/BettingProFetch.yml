name: Fetch BP files

on: 
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC only. In Eastern time these fire at (EDT / EST):
    #   03:18 UTC daily   -> 11:18pm / 10:18pm  ("midnight" update)
    #   15:18 UTC daily   -> 11:18am / 10:18am  ("noon" update)
    #   11:18 UTC Sun     ->  7:18am /  6:18am  (Sunday morning update)
    #   21:18 UTC Mon+Thu ->  5:18pm /  4:18pm  (Monday/Thursday evening update)
    # Scheduled runs routinely start 40 minutes to 4 hours late, so the
    # `gate` job below maps the run to a window around its slot instead of
    # an exact hour, and skips only when a snapshot was already committed
    # inside that window.
    - cron: '18 3,15 * * 0,1,2,3,4,5,6'
    - cron: '18 11 * * 0'
    - cron: '18 21 * * 1,4'
    
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.et.outputs.run }}
    steps:
    - name: Map the run to its Eastern-time window and skip if already fetched
      id: et
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "${{ github.event_name }}" != "schedule" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        export TZ=America/New_York
        hour=$(date +%H)
        dow=$(date +%a)
        today=$(date +%F)
        # Window start (local ET) for the slot this run belongs to. The
        # midnight slot's window straddles the day boundary (10pm-5:59am).
        case "${hour}/${dow}" in
          22/*|23/*)             slot="midnight"; start=$(date -d "${today} 22:00" +%s) ;;
          0[0-5]/*)              slot="midnight"; start=$(date -d "${today} 22:00 1 day ago" +%s) ;;
          1[0-5]/*)              slot="noon";     start=$(date -d "${today} 10:00" +%s) ;;
          0[6-9]/Sun)            slot="sunday-am"; start=$(date -d "${today} 06:00" +%s) ;;
          1[6-9]/Mon|1[6-9]/Thu) slot="evening";  start=$(date -d "${today} 16:00" +%s) ;;
          *)                     slot=""; start=0 ;;
        esac
        echo "Eastern time now: ${dow} $(date +%H:%M) -> slot=${slot:-none}"
        if [ -z "${slot}" ]; then
          echo "run=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Newest commit that touched the data directory on this branch. If the
        # lookup fails, assume nothing was fetched and run.
        last=$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=BettingProsFiles&sha=${GITHUB_REF_NAME}&per_page=1" \
          --jq '.[0].commit.committer.date' 2>/dev/null || true)
        last_epoch=$(date -d "${last:-1970-01-01T00:00:00Z}" +%s 2>/dev/null || echo 0)
        echo "Window start: $(date -d "@${start}" '+%a %F %H:%M %Z'); last data commit: $(date -d "@${last_epoch}" '+%a %F %H:%M %Z')"
        if [ "${last_epoch}" -ge "${start}" ]; then
          echo "Snapshot already committed in the ${slot} window -> skipping"
          run=false
        else
          run=true
        fi
        echo "run=${run}" >> "$GITHUB_OUTPUT"

  fetch-json:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '14'
    - name: Calculate Week Number
      id: week
      run: |
        # Create a script to calculate the week number
        echo '
        function getWeekNumber() {
            const startDate = new Date("2026-09-05");
            const currentDate = new Date();
            const diffTime = currentDate - startDate;
            const diffWeeks = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7));
            const weekNumber = Math.min(Math.max(diffWeeks + 1, 1), 18);
            return weekNumber;
        }
        console.log(getWeekNumber());
        ' > calculateWeek.js
        
        # Run the script and output the week number
        weekNumber=$(node calculateWeek.js)
        echo "weekNumber=$weekNumber" >> $GITHUB_ENV
    - name: Generate Filename
      id: filename
      run: |
        # Generate a unique filename based on week number and an incrementing integer
        weekNumber=${{ env.weekNumber }}
        indexFile="BettingProsFiles/2026lastIndex${{ env.weekNumber }}.txt"

        # Retrieve or initialize the index
        if [ -f $indexFile ]; then
          lastIndex=$(cat $indexFile)
          nextIndex=$((lastIndex + 1))
        else
          nextIndex=0
        fi

        # Save the updated index
        echo $nextIndex > $indexFile

        # Construct the filename
        filename="BettingProsFiles/2026week${weekNumber}${nextIndex}"
        echo "filename=$filename" >> $GITHUB_ENV
        echo "nextIndex=$nextIndex" >> $GITHUB_ENV
        # Running union of the week's props (see scripts/merge-bp-carry.sh)
        echo "carryfile=BettingProsFiles/2026carry${weekNumber}.json" >> $GITHUB_ENV

    - name: Fetch JSON from URL
      id: fetch_json
      env:
        # BettingPros requires the x-api-key header. Prefer a repo secret;
        # fall back to the public web-app key if the secret isn't set.
        BP_API_KEY: ${{ secrets.BP_API_KEY }}
      run: |
        set -euo pipefail

        api_key="${BP_API_KEY:-CHi8Hy5CEE4khd46XNYL23dCFX96oUdw6qOt1Dnh}"
        markets="73:74:102:103:100:333:101:106:107:76:105:75:104:66:71:78:253"
        tmp="${RUNNER_TEMP:-/tmp}/props.ndjson"

        # 1. Event IDs for the current slate (update this list each week).
        event_ids="21920:21906:21924:21926:21922:21921:21925:22120:21927:21923:21928:21930:21931:21929:21907:21910"
        echo "Event IDs: ${event_ids}"

        base="https://api.bettingpros.com/v3/props?limit=200&sport=NFL&market_id=${markets}&event_id=${event_ids}&ev_threshold=false&include_selections=false&include_markets=true&include_counts=true"

        # 2. Fetch page 1 to learn the page count (the API caps at 200/page).
        page1=$(curl -s -H "x-api-key: ${api_key}" "${base}&page=1")
        total_pages=$(echo "${page1}" | jq -r '._pagination.total_pages // 1')
        echo "Total pages: ${total_pages}"

        # 3. Collect props from every page into newline-delimited JSON.
        echo "${page1}" | jq -c '.props[]' > "${tmp}"
        page=2
        while [ "${page}" -le "${total_pages}" ]; do
          curl -s -H "x-api-key: ${api_key}" "${base}&page=${page}" \
            | jq -c '.props[]' >> "${tmp}"
          page=$((page + 1))
        done

        # 4. Offers fallback: /props is missing consensus lines for some
        #    players (e.g. QB anytime-TD / interceptions); /offers still has
        #    them under book id 0 (link = bettingpros.com). Pull the same 7
        #    markets the app consumes and distill each to
        #    {market_id, name, position, odds, line}. /offers caps limit at
        #    10/page, so it pages more finely than /props.
        offers_markets="78:101:102:103:104:105:107"
        offers_tmp="${RUNNER_TEMP:-/tmp}/offers.ndjson"
        obase="https://api.bettingpros.com/v3/offers?sport=NFL&market_id=${offers_markets}&event_id=${event_ids}&limit=10"
        # Lines with is_off=true are placeholders pulled from the board (e.g.
        # a 43.5 rushing-yards line for a WR at -118/-118); skip them.
        distill='.offers[] |
          if .market_id == 78 then
            .selections[] | . as $s | ($s.books[]|select(.id==0)|.lines[0]) as $l | select($l!=null and $l.is_off!=true)
              | {market_id:78, name:$s.label, position:null, odds:$l.cost, line:$l.line}
          else
            . as $o | ($o.selections[]|select(.selection=="over")) as $s | ($s.books[]|select(.id==0)|.lines[0]) as $l
              | select($l!=null and $l.is_off!=true and (($o.participants|length)>0))
              | {market_id:$o.market_id, name:$o.participants[0].name, position:$o.participants[0].player.position, odds:$l.cost, line:$l.line}
          end'

        opage1=$(curl -s -H "x-api-key: ${api_key}" "${obase}&page=1")
        offers_pages=$(echo "${opage1}" | jq -r '._pagination.total_pages // 1')
        echo "Offers pages: ${offers_pages}"
        echo "${opage1}" | jq -c "${distill}" > "${offers_tmp}"
        opage=2
        while [ "${opage}" -le "${offers_pages}" ]; do
          curl -s -H "x-api-key: ${api_key}" "${obase}&page=${opage}" \
            | jq -c "${distill}" >> "${offers_tmp}"
          opage=$((opage + 1))
        done

        # 5. Merge props + offers into one document the app reads.
        jq -n \
          --slurpfile props "${tmp}" \
          --slurpfile offers "${offers_tmp}" \
          '{props: $props, offers: $offers}' > "${{ env.filename }}"
        rm -f "${tmp}" "${offers_tmp}"

        count=$(jq '.props | length' "${{ env.filename }}")
        ocount=$(jq '.offers | length' "${{ env.filename }}")
        echo "Wrote ${count} props + ${ocount} offers to ${{ env.filename }}"
        if [ "${count}" -eq 0 ]; then
          echo "::error::0 props written — aborting so no empty file is committed"
          exit 1
        fi

        # 6. Fold this snapshot into the week's carry file so props that
        #    later disappear keep their last posted value.
        bash scripts/merge-bp-carry.sh "${{ env.filename }}" "${{ env.carryfile }}" "${{ env.nextIndex }}"

    - name: Commit and push changes
      uses: EndBug/add-and-commit@v9
      with:
        author_name: sangactions
        author_email: sangkyun.hanpro@gmail.com
        message: "Update JSON data file in BettingProsFiles"
        add: '.'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
